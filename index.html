<!DOCTYPE html>
<html>
<head>
<title>My  bestie's Story</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
  }
  .page {
    display: none;
    width: 100%;
    height: 100%;
  }
  .page.active { display: block; }
  img {
    max-height: 95vh;   /* fit vertically */
    max-width: 100%;    /* fit horizontally */
    object-fit: contain;
    border-radius: 12px;
  }
  h2, p {
    font-size: 1.4em;
    margin: 20px;
  }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 1.2em;
    border: none;
    border-radius: 8px;
    background: #ff4081;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="story"></div>

<script>
const openingNote = `
  <h2>Opening Note 💕</h2>
  <p>This is the future story of my dear bestie bhabana,
  predicted by so called god biyog hamsher rawal.</p>
`;

const closingNote = `
  <h2> Closing Note 💖</h2>
  <p>My Dear friend be happy , 
  foot ball team nai banaunu la baccha chimpanzee ko </p>
`;

// Add all 18 photo filenames here
const photos = [
  "photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg",
  "photo6.jpg","photo7.jpg","photo8.jpg","photo9.jpg","photo10.jpg",
  "photo11.jpg","photo12.jpg","photo13.jpg","photo14.jpg","photo15.jpg",
  "photo16.jpg","photo17.jpg","photo18.jpg"
];

let currentPage = 0;

function renderPage() {
  const container = document.getElementById("story");
  container.innerHTML = ""; // clear

  let content = "";
  if (currentPage === 0) {
    content = openingNote + `<button onclick="nextPage()">Next</button>`;
  } else if (currentPage <= photos.length) {
    const photoIndex = currentPage - 1;
    content = `<h2>Photo ${currentPage}</h2>
               <img src="${photos[photoIndex]}" alt="Photo ${currentPage}">
               <button onclick="nextPage()">Next</button>`;
  } else {
    content = closingNote + `<button onclick="alert('The End!')">Finish</button>`;
  }

  container.innerHTML = `<div class="page active">${content}</div>`;
}

function nextPage() {
  if (currentPage < photos.length + 1) {
    currentPage++;
    renderPage();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
  }
}

// Swipe detection
let startX = 0;
document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});
document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  if (endX - startX > 50) { // swipe right
    prevPage();
  } else if (startX - endX > 50) { // swipe left
    nextPage();
  }
});

// start with opening note
renderPage();
</script>

</body>
</html>
